name: sam-be-prod

services:
  backend:
    container_name: sam-backend
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/sam-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      BACKEND_PORT: "8080"
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped
