name: CI - Pull Request

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  pr-lint:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sam_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper/dists
          key: ${{ runner.os }}-${{ runner.arch }}-maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Initialize Maven Wrapper
        timeout-minutes: 5
        env:
          MVNW_VERBOSE: 'true'
        run: |
          chmod +x mvnw
          for attempt in 1 2 3; do
            if ./mvnw -B --version; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Maven Wrapper setup failed (attempt ${attempt}/3); retrying in 10 seconds."
              sleep 10
            fi
          done
          echo "::error::Maven Wrapper setup failed after 3 attempts."
          exit 1

      - name: Run Tests with Maven
        env:
          SPRING_PROFILES_ACTIVE: dev
          SHOW_SQL: false
          HIBERNATE_DDL_AUTO: validate
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sam_db
          DB_USERNAME: postgres
          DB_PASSWORD: 12345
          DB_POOL_MAX: 20
          DB_POOL_MIN: 5
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          FINANCE_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/sam_db
          FINANCE_TEST_DATABASE_USER: postgres
          FINANCE_TEST_DATABASE_PASSWORD: 12345
          BACKEND_PORT: 8080
          JWT_SIGNER_KEY_BASE64: FbPjsvkQ3V1x/x/59fVkc5tBPWEBajaTfaiHItuQDhqqQ/TtrNYl347n8AWn+Ui8eDUf7yYXMo+5pzn5pkqKhw==
          JWT_ACCESS_EXPIRATION: 900
          JWT_REFRESH_EXPIRATION: 604800
          JWT_ISSUER: sam-be
          JWT_COOKIE_SECURE: false
        run: ./mvnw -B clean test

      - name: Check demo migration preserves business data
        run: python3 -B -m unittest discover -s src/test/python -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sam-be:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
