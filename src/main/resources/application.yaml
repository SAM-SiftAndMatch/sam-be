spring:
  application:
    name: sam-be

  # Load file .env trực tiếp vào Spring Environment
  config:
    import: "optional:file:.env[.properties]"

  # Cấu hình kết nối Database PostgreSQL bằng biến môi trường trong .env
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
