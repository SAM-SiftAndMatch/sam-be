spring:
  application:
    name: sam-be

  # Load file .env trực tiếp vào Spring Environment nếu có
  config:
    import: "optional:file:.env[.properties]"

  # Profiles
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  # Cấu hình kết nối Database PostgreSQL thuần biến môi trường
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX}
      minimum-idle: ${DB_POOL_MIN}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Cấu hình Redis thuần biến môi trường
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL}
      timeout: 3000ms
      repositories:
        enabled: false

  # JPA & Hibernate: Chuyển ddl-auto thành validate để Flyway làm chủ quản lý schema
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO}
    open-in-view: false
    show-sql: ${SHOW_SQL}
    properties:
      hibernate:
        format_sql: false

  # Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true

# Spring Boot Actuator Endpoints (Health Check & Metrics)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

server:
  port: ${BACKEND_PORT}
  forward-headers-strategy: framework

# JWT Security Configuration thuần biến môi trường (không dùng fallback :default)
jwt:
  signer-key-base64: ${JWT_SIGNER_KEY_BASE64}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  issuer: ${JWT_ISSUER}
  cookie-secure: ${JWT_COOKIE_SECURE}

# Swagger UI Authentication (chỉ bật khi SWAGGER_AUTH_ENABLED=true và SWAGGER_PASSWORD được set)
swagger:
  auth-enabled: ${SWAGGER_AUTH_ENABLED:false}
  username: ${SWAGGER_USERNAME}
  password: ${SWAGGER_PASSWORD}

# VNPay Sandbox Configuration (thanh toán ký quỹ Escrow)
vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  api-url: ${VNPAY_API_URL}
  api-query-url: ${VNPAY_API_QUERY_URL}
  return-url: ${VNPAY_RETURN_URL}
  ipn-url: ${VNPAY_IPN_URL}
  default-client-ip: ${VNPAY_DEFAULT_CLIENT_IP}
