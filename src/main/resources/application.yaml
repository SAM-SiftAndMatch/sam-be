spring:
  application:
    name: sam-be

  # Load file .env trực tiếp vào Spring Environment nếu có
  config:
    import: "optional:file:.env[.properties]"

  # Profiles
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  # Cấu hình kết nối Database PostgreSQL thuần biến môi trường
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX}
      minimum-idle: ${DB_POOL_MIN}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Cấu hình Redis thuần biến môi trường
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL}
      timeout: 3000ms
      repositories:
        enabled: false

  # JPA & Hibernate: Chuyển ddl-auto thành validate để Flyway làm chủ quản lý schema
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO}
    open-in-view: false
    show-sql: ${SHOW_SQL}
    properties:
      hibernate:
        format_sql: false

  # Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true

# Spring Boot Actuator Endpoints (Health Check & Metrics)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

server:
  port: ${BACKEND_PORT}
  forward-headers-strategy: framework

# JWT Security Configuration thuần biến môi trường (không dùng fallback :default)
jwt:
  signer-key-base64: ${JWT_SIGNER_KEY_BASE64}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  issuer: ${JWT_ISSUER}
  cookie-secure: ${JWT_COOKIE_SECURE}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
    frontend-origin: ${GOOGLE_OAUTH_FRONTEND_ORIGIN:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Swagger UI Authentication (chỉ bật khi SWAGGER_AUTH_ENABLED=true và SWAGGER_PASSWORD được set)
swagger:
  auth-enabled: ${SWAGGER_AUTH_ENABLED:false}
  username: ${SWAGGER_USERNAME}
  password: ${SWAGGER_PASSWORD}

payments:
  creation-enabled: ${PAYMENTS_CREATION_ENABLED:true}
  creation-delay-ms: ${PAYMENTS_CREATION_DELAY_MS:1000}
  ipn-retry-delay-ms: ${PAYMENTS_IPN_RETRY_DELAY_MS:2000}
  monitor-delay-ms: ${PAYMENTS_MONITOR_DELAY_MS:30000}
  return-url: ${PAYMENTS_RETURN_URL:}
  allowed-return-origins: ${PAYMENTS_ALLOWED_RETURN_ORIGINS:}
  provider: ${PAYMENTS_PROVIDER:pay2s}
  environment: ${PAYMENTS_ENVIRONMENT:SANDBOX}
pay2s:
  base-url: ${PAY2S_BASE_URL:https://payment.pay2s.vn}
  access-key: ${PAY2S_ACCESS_KEY:}
  secret-key: ${PAY2S_SECRET_KEY:}
  partner-code: ${PAY2S_PARTNER_CODE:}
  bank-code: ${PAY2S_BANK_CODE:}
  bank-account: ${PAY2S_BANK_ACCOUNT:}
  ipn-url: ${PAY2S_IPN_URL:}
finance:
  bank-active-key: ${FINANCE_BANK_ACTIVE_KEY:v1}
  bank-keys: ${FINANCE_BANK_KEYS:}
  bank-fingerprint-key: ${FINANCE_BANK_FINGERPRINT_KEY:}
  live-payouts-enabled: ${FINANCE_LIVE_PAYOUTS_ENABLED:false}
  dual-control: ${FINANCE_DUAL_CONTROL:true}
  minimum-withdrawal: ${FINANCE_MINIMUM_WITHDRAWAL:50000}
  daily-withdrawal-limit: ${FINANCE_DAILY_WITHDRAWAL_LIMIT:100000000}
