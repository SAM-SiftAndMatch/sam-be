spring:
  application:
    name: sam-be

  # Load file .env trực tiếp vào Spring Environment nếu có
  config:
    import: "optional:file:.env[.properties]"

  # Profiles (mặc định là dev nếu không set)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Cấu hình kết nối Database PostgreSQL với fallback an toàn
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sam_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Cấu hình Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  # JPA & Hibernate: Chuyển ddl-auto thành validate để Flyway làm chủ quản lý schema
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false

  # Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true

# Spring Boot Actuator Endpoints (Health Check & Metrics)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

server:
  port: ${BACKEND_PORT:8080}

# JWT Security Configuration
jwt:
  signer-key-base64: ${JWT_SIGNER_KEY_BASE64:}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  issuer: ${JWT_ISSUER:sam-be}
